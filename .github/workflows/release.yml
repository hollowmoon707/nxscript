name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: ubuntu
          - runner: windows-2022
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "pyinstaller==6.22.3" ".[dev]"
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev
      - name: Prepare stock Python 2.7.3
        run: python tools/release/build_python27.py "${{ runner.temp }}/python27-build" "${{ runner.temp }}/python27"
      - name: Test conversions
        env:
          NXSCRIPT_PY27: ${{ runner.temp }}/python27/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python2.7' }}
          NXSCRIPT_DECOMPILER_PYTHON: ${{ runner.temp }}/python27/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python2.7' }}
        run: python -m pytest -q
      - name: Build and test release archives
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          python tools/release/build_assets.py --runtime "${{ runner.temp }}/python27" --out release-assets --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: nxscript-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nxscript-*
          path: release-assets
          merge-multiple: true
      - name: Publish all four archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(release-assets/*.zip release-assets/*.tar.gz)
          test "${#files[@]}" -eq 4
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${files[@]}"
