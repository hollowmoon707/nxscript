[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nxscript"
version = "0.1.0"
description = "Pack and unpack individual NeoX Python scripts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rich>=13.7", "mmh3>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nxscript = "nxscript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
